[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "falsifier"
version = "0.1.0-dev"
description = "Disequilibrium screening and false-positive triage for exoplanet candidates."
requires-python = ">=3.11"
# Core runtime deps: pydantic + numpy.
# numpy is a genuine core dep, not a test convenience: UnitedArray in
# falsifier/pipeline/contracts/manifest.py uses numpy at module scope for
# array serialisation and dtype coercion.  The fast CI job installs
# pydantic + numpy and nothing else; any accidental module-scope import
# of astropy, lightkurve, sklearn, etc. will surface immediately.
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "pytest>=7.4",
    "pytest-timeout>=2.1",
    "pytest-asyncio>=0.23",
    "astropy>=5.3",
    "lightkurve>=2.4",
    "astroquery>=0.4",
    "pandas>=2.0",
    "fastapi>=0.111",
    "httpx>=0.27",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "transitleastsquares>=1.27",
    "wotan>=1.9",
    "ibm-watsonx-ai>=1.1",
    # batman-package is a transitleastsquares dependency that imports
    # distutils.ccompiler at module scope.  distutils was removed in Python 3.12.
    # falsifier._distutils_compat injects a stub before any batman import occurs,
    # so the distutils removal is handled in committed code rather than relying on
    # a venv-local sitecustomize.py.  Pinning batman here ensures it is present
    # after a clean clone + pip install -e ".[dev]".
    "batman-package>=2.4",
    "transformers>=4.40",
    # setuptools>=68 is needed for _distutils_hack (the real distutils shim)
    # to be available as a fallback inside falsifier._distutils_compat.
    "setuptools>=68",
]

# ---------------------------------------------------------------------------
# System prerequisites (not pip-installable — must be present before pip install)
# ---------------------------------------------------------------------------
#
# macOS:
#   brew install libomp
#   Reason: XGBoost's macOS wheel (xgboost>=2.0) embeds a reference to
#   @rpath/libomp.dylib with LC_RPATH=/opt/homebrew/opt/libomp/lib.
#   The dynamic linker resolves this through the Homebrew keg symlink at
#   /opt/homebrew/opt/libomp -> ../Cellar/libomp/X.Y.Z.
#   Without it, `import xgboost` raises:
#     XGBoostError: Library not loaded: @rpath/libomp.dylib
#   This is a property of the prebuilt wheel, not of this project.
#
# Ubuntu / CI:
#   sudo apt-get install libomp-dev
#   In practice libgomp1 (part of the gcc runtime) satisfies the Ubuntu wheel.
#   The GitHub Actions ubuntu-latest image has libgomp1 pre-installed.
#   The test-full CI job installs libomp-dev explicitly so the dependency is
#   documented and runner changes do not silently break XGBoost imports.

[tool.setuptools.packages.find]
# Flat layout: falsifier/ lives directly under the repo root, not under src/.
# No `where` key needed (defaults to ".").
include = ["falsifier*"]

[tool.pytest.ini_options]
# Kill any test that hangs for more than 30 s.  Golden-file regression tests
# that legitimately need more time opt in with @pytest.mark.timeout(60).
timeout = 30
asyncio_mode = "auto"
# scripts/ contains deliberate mutation test scripts (_mutation_gate*.py) whose
# purpose is to FAIL when run directly.  Exclude the directory from automatic
# pytest collection so that plain `pytest` or `pytest tests/` never picks them up.
norecursedirs = ["scripts", ".venv", "node_modules", "frontend", "data", ".git"]
markers = [
    "no_network: block outbound sockets; any network attempt fails immediately.",
    "timeout: per-test wall-clock budget in seconds.",
    "requires_astropy: test requires astropy (and optionally pandas/xgboost/lightkurve); excluded from the fast CI job.",
    "live_network: test requires a live internet connection to MAST; skip with -m 'not live_network' in offline CI.",
]
