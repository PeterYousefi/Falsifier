# IBM Code Engine — Falsifier backend application manifest
#
# Constraints (non-negotiable per AGENTS.md):
#   min-scale=1  — _job_store is in-process memory; a second instance would
#                  lose all in-flight jobs.  min-scale=1 also avoids the
#                  multi-hundred-MB cold start that would otherwise kill the
#                  first pipeline request.
#   max-scale=1  — same reason.
#   timeoutSeconds=600  — a first-time MAST fetch + TLS search can take
#                  several minutes; the SSE stream must stay open throughout.
#   memory 4Gi   — TLS on a 4-year Kepler long-cadence light curve peaks at
#                  ~3 GB.  Start at 4 Gi and measure before reducing.
#
# Deploy commands (ibmcloud CLI):
#   See deploy/deploy.sh for the complete step-by-step script.
#
# Prerequisites:
#   ibmcloud plugin install code-engine
#   ibmcloud login
#   ibmcloud ce project select --name <your-project>
#
# References:
#   https://cloud.ibm.com/docs/codeengine?topic=codeengine-application-workloads
#   https://cloud.ibm.com/docs/codeengine?topic=codeengine-cli#cli-application-create
#   Knative serving.knative.dev/v1 spec:
#   https://knative.dev/docs/reference/api/serving-api/
#
# After deploying, set the returned application URL as VITE_API_BASE_URL in
# your Vercel project environment variables, then redeploy the frontend.
# Set ALLOWED_ORIGINS=https://falsifier.vercel.app in the Code Engine app env.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: falsifier-backend
  annotations:
    serving.knative.dev/creator: falsifier
spec:
  template:
    metadata:
      annotations:
        # ----------------------------------------------------------------
        # Scaling: exactly one instance, always warm.
        # Non-negotiable: _job_store is in-process; two instances would
        # each hold half the jobs, causing 50% 404s.
        # ----------------------------------------------------------------
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        # Scale-to-zero window (irrelevant at minScale=1 but kept for clarity)
        autoscaling.knative.dev/window: "600s"
    spec:
      # ----------------------------------------------------------------
      # Request timeout: 600 s
      # A first-time MAST fetch (30–120 s) + TLS search on a 4-year
      # Kepler light curve can approach 5 minutes.  The SSE stream must
      # remain open for the full run.
      # Code Engine maps this to its own --request-timeout flag.
      # ----------------------------------------------------------------
      timeoutSeconds: 600

      # Single concurrent pipeline job per instance keeps memory bounded.
      # The in-process job queue serialises beyond that.
      containerConcurrency: 4

      containers:
        - name: falsifier-backend
          # Replace with your IBM Container Registry image reference, e.g.:
          #   private.icr.io/your-namespace/falsifier-backend:latest
          image: YOUR_REGISTRY/falsifier-backend:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "1000m"
              # TLS on a 4-year Kepler LC peaks at ~3 GB; start at 4 Gi.
              memory: "4Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            # ----------------------------------------------------------------
            # CORS: restrict to the Vercel frontend origin.
            # Multiple origins are comma-separated.
            # ----------------------------------------------------------------
            - name: ALLOWED_ORIGINS
              value: "https://falsifier.vercel.app"
            # ----------------------------------------------------------------
            # Ingest cache root: point at the mounted persistent volume so
            # repeat MAST fetches skip the network.
            # See volumeMounts below.
            # ----------------------------------------------------------------
            - name: FALSIFIER_CACHE_ROOT
              value: "/data/cache/ingest"
            # ----------------------------------------------------------------
            # Secrets: inject watsonx.ai credentials from a Code Engine secret.
            # Create the secret once:
            #   ibmcloud ce secret create --name falsifier-secrets \
            #     --from-literal WATSONX_APIKEY=... \
            #     --from-literal WATSONX_URL=https://us-south.ml.cloud.ibm.com \
            #     --from-literal WATSONX_PROJECT_ID=...
            # Then uncomment:
            # ----------------------------------------------------------------
            # - name: WATSONX_APIKEY
            #   valueFrom:
            #     secretKeyRef:
            #       name: falsifier-secrets
            #       key: WATSONX_APIKEY
            # - name: WATSONX_URL
            #   valueFrom:
            #     secretKeyRef:
            #       name: falsifier-secrets
            #       key: WATSONX_URL
            # - name: WATSONX_PROJECT_ID
            #   valueFrom:
            #     secretKeyRef:
            #       name: falsifier-secrets
            #       key: WATSONX_PROJECT_ID
          volumeMounts:
            # ----------------------------------------------------------------
            # Persistent volume for the content-addressed ingest cache.
            # Repeat targets skip the MAST fetch entirely once cached.
            # Provision an IBM Cloud File Storage PVC and reference it here.
            # ----------------------------------------------------------------
            - name: cache-volume
              mountPath: /data/cache

      volumes:
        - name: cache-volume
          # Replace <your-pvc-name> with the name of your provisioned PVC.
          # Provision via IBM Cloud console or:
          #   ibmcloud ce persistentvolumeclaim create \
          #     --name falsifier-cache-pvc \
          #     --request-storage 10Gi
          persistentVolumeClaim:
            claimName: falsifier-cache-pvc
