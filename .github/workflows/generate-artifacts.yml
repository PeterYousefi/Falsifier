name: Generate TLS Artifacts

# Triggered manually only.  Never runs automatically.
# After the merge job completes, download the uploaded artifacts, commit them,
# and push.
#
# Architecture
# ------------
# The injection-recovery run on multi-quarter (Q1–Q8) baselines is expensive.
# On the Q3-only pilot (KIC 7272437, BLS_fallback) one TLS call on ~24,000
# cadences took ~3–4 minutes.  At 5 injections per cell × 6 periods × 9 depths
# = 270 injections per star, a single-star job would run for ~14–18 hours —
# far beyond the 6-hour Actions limit.
#
# Sharding strategy: one job per (star × depth), 5 × 9 = 45 parallel jobs.
# Each job runs 6 periods × 5 per cell = 30 injections (~90–120 min on Q1–Q8).
#
# Checkpoint-and-resume: each shard writes a JSONL checkpoint file incrementally.
# If a job is re-run (Actions retry) it picks up where it left off.
#
# Timing measurement: a dedicated pre-flight job measures the actual per-injection
# cost on the Q1–Q8 baseline before committing to the full matrix.  The result
# is uploaded as a workflow artifact.
#
# The adversarial self-test is a separate single job (fast, ~10 min).
on:
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # Shared setup — verify TLS and batman in a fresh spawn worker.
  # This is a mandatory gate; if it fails the matrix jobs don't start.
  # ---------------------------------------------------------------------------
  setup-check:
    name: Verify TLS + batman (pre-flight)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OpenMP runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify TLS imports
        run: |
          python - <<'EOF'
          import transitleastsquares
          from importlib.metadata import version, PackageNotFoundError

          tls_cls = transitleastsquares.transitleastsquares
          assert callable(tls_cls), "transitleastsquares.transitleastsquares is not callable"

          try:
              ver = version("transitleastsquares")
          except PackageNotFoundError:
              ver = "unknown"

          print(f"transitleastsquares {ver} OK (transitleastsquares.transitleastsquares callable)")
          EOF

      - name: Verify batman loads in a spawn worker process
        run: python scripts/_verify_spawn_worker.py

  # ---------------------------------------------------------------------------
  # Per-injection timing measurement.
  # Runs ONE (period, depth) cell — 5 injections — on the committed KIC 7272437
  # Q1–Q8 file (already in data/golden/) and records the wall-clock cost.
  # Outputs:
  #   tls-timing-measurement.json  — uploaded as a workflow artifact
  # ---------------------------------------------------------------------------
  measure-tls-timing:
    name: Measure TLS per-injection cost
    runs-on: ubuntu-latest
    needs: setup-check

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OpenMP runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # Run the smallest possible real TLS injection to get a per-injection
      # wall-clock measurement on the Q1–Q8 baseline (~24,000 cadences).
      # Depth=1500 ppm, period=5.0 d, n-per-cell=5 gives 5 TLS calls.
      - name: Run timing probe (5 injections, 1500 ppm, 5.0 d, KIC 7272437)
        run: |
          mkdir -p /tmp/timing_out /tmp/timing_ck
          python -c "
          import time, json, pathlib

          t0 = time.monotonic()
          import subprocess, sys
          result = subprocess.run(
              [
                  sys.executable, 'scripts/injection_recovery.py',
                  '--seed', '42',
                  '--n-per-cell', '5',
                  '--depth-filter', '1500',
                  '--output-dir', '/tmp/timing_out',
                  '--output-name', 'timing_probe',
                  '--data-dir', 'data/golden',
                  '--quiet-stars-list', '/dev/stdin',
                  '--no-plot',
              ],
              input=b'star_id\nKIC 7272437\n',
          )
          elapsed = time.monotonic() - t0

          n_injections = 5
          per_injection_s = elapsed / n_injections

          measurement = {
              'star': 'KIC 7272437',
              'n_cadences_approx': 23784,
              'n_injections': n_injections,
              'depth_ppm': 1500,
              'period_days': 5.0,
              'total_elapsed_s': round(elapsed, 1),
              'per_injection_s': round(per_injection_s, 1),
              'estimated_30inj_job_min': round(30 * per_injection_s / 60, 1),
              'exit_code': result.returncode,
          }
          out = pathlib.Path('/tmp/timing_out/tls-timing-measurement.json')
          out.write_text(json.dumps(measurement, indent=2) + '\n')
          print(json.dumps(measurement, indent=2))
          if result.returncode != 0:
              sys.exit(result.returncode)
          "

      - name: Upload timing measurement
        uses: actions/upload-artifact@v4
        with:
          name: tls-timing-measurement
          path: /tmp/timing_out/tls-timing-measurement.json
          if-no-files-found: error
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Adversarial self-test — single job, independent of matrix.
  # ---------------------------------------------------------------------------
  adversarial-selftest:
    name: Adversarial self-test
    runs-on: ubuntu-latest
    needs: setup-check

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OpenMP runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # Fetch Q1–Q8 FITS for all five quiet stars so every star has the same
      # multi-quarter baseline in this run.  KIC 7272437 already has a committed
      # Q1–Q8 file; --force re-fetches it so the shard-selection logic (longest
      # baseline wins) selects Q1–Q8 consistently for every star.
      #
      # Why Q1–Q8 here (not Q3): the committed KIC 7272437 Q1–Q8 file (~23,784
      # cadences) would otherwise be auto-selected by load_light_curve() while the
      # other four stars fall back to their Q3-only files (~3,000–4,000 cadences).
      # Mixed baselines produce inconsistent n_cadences across the trial table,
      # which confounds per-star false-alarm comparisons.
      - name: Fetch Q1–Q8 light curves for all five quiet stars
        run: |
          for star in "KIC 1161145" "KIC 5084157" "KIC 7272437" "KIC 7347849" "KIC 8935630"; do
            python scripts/fetch_golden.py --target "$star" --force
          done

      - name: Run adversarial_selftest.py
        run: |
          python scripts/adversarial_selftest.py \
            --seed 42 \
            --n-trials 20 \
            --output-dir data/artifacts \
            --data-dir data/golden \
            --no-plot

      - name: Verify artifact used TLS (not BLS_fallback)
        run: |
          python - <<'EOF'
          import json, sys, pathlib

          path = pathlib.Path("data/artifacts/adversarial_selftest.json")
          data = json.loads(path.read_text())
          alg  = data.get("detection_algorithm", "<missing>")
          if alg != "TLS":
              print(f"FAIL: {path.name}: detection_algorithm={alg!r} (expected 'TLS')", file=sys.stderr)
              sys.exit(1)

          # Guard: quiet_stars must NOT contain the contaminated originals.
          contaminated = {"KIC 3425851", "KIC 5514383", "KIC 9410930", "KIC 10963065"}
          found = contaminated & set(data.get("quiet_stars", []))
          if found:
              print(
                  f"FAIL: artifact quiet_stars still contains contaminated entries: {found}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print(f"Verified: detection_algorithm=TLS")
          print(f"Quiet stars: {data.get('quiet_stars')}")
          EOF

      - name: Upload adversarial self-test artifact
        uses: actions/upload-artifact@v4
        with:
          name: adversarial-selftest
          path: |
            data/artifacts/adversarial_selftest.json
            data/artifacts/adversarial_selftest.manifest.json
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Per-(star × depth) injection-recovery shards — matrix, 45 parallel jobs.
  #
  # Each job runs 6 periods × 5 per cell = 30 injections for one star and one
  # depth slice.  A shard writes:
  #   data/artifacts/shards/injection_recovery_<tag>.json
  #   data/artifacts/shards/injection_recovery_<tag>.manifest.json
  #
  # The checkpoint JSONL is uploaded separately (see checkpoint artifact) so that
  # a re-triggered job can resume instead of restarting from scratch.
  #
  # Depth groups are named d0–d8 corresponding to DEPTH_GRID_PPM indices.
  # ---------------------------------------------------------------------------
  injection-recovery-shard:
    name: IR shard — ${{ matrix.star }} / ${{ matrix.depth_ppm }} ppm
    runs-on: ubuntu-latest
    needs: setup-check
    timeout-minutes: 300   # 5-hour per-job cap; 30 injections × ~9 min each = ~4.5 h

    strategy:
      fail-fast: false   # one shard failing should not cancel the others
      matrix:
        include:
          # ---- KIC 1161145 ----
          - star: "KIC 1161145"
            tag: kic_1161145
            depth_ppm: 50
            depth_tag: d0
          - star: "KIC 1161145"
            tag: kic_1161145
            depth_ppm: 100
            depth_tag: d1
          - star: "KIC 1161145"
            tag: kic_1161145
            depth_ppm: 200
            depth_tag: d2
          - star: "KIC 1161145"
            tag: kic_1161145
            depth_ppm: 400
            depth_tag: d3
          - star: "KIC 1161145"
            tag: kic_1161145
            depth_ppm: 800
            depth_tag: d4
          - star: "KIC 1161145"
            tag: kic_1161145
            depth_ppm: 1500
            depth_tag: d5
          - star: "KIC 1161145"
            tag: kic_1161145
            depth_ppm: 3000
            depth_tag: d6
          - star: "KIC 1161145"
            tag: kic_1161145
            depth_ppm: 6000
            depth_tag: d7
          - star: "KIC 1161145"
            tag: kic_1161145
            depth_ppm: 12000
            depth_tag: d8
          # ---- KIC 5084157 (replaces KIC 5347580 — no Q1-Q8 MAST data) ----
          - star: "KIC 5084157"
            tag: kic_5084157
            depth_ppm: 50
            depth_tag: d0
          - star: "KIC 5084157"
            tag: kic_5084157
            depth_ppm: 100
            depth_tag: d1
          - star: "KIC 5084157"
            tag: kic_5084157
            depth_ppm: 200
            depth_tag: d2
          - star: "KIC 5084157"
            tag: kic_5084157
            depth_ppm: 400
            depth_tag: d3
          - star: "KIC 5084157"
            tag: kic_5084157
            depth_ppm: 800
            depth_tag: d4
          - star: "KIC 5084157"
            tag: kic_5084157
            depth_ppm: 1500
            depth_tag: d5
          - star: "KIC 5084157"
            tag: kic_5084157
            depth_ppm: 3000
            depth_tag: d6
          - star: "KIC 5084157"
            tag: kic_5084157
            depth_ppm: 6000
            depth_tag: d7
          - star: "KIC 5084157"
            tag: kic_5084157
            depth_ppm: 12000
            depth_tag: d8
          # ---- KIC 7272437 ----
          - star: "KIC 7272437"
            tag: kic_7272437
            depth_ppm: 50
            depth_tag: d0
          - star: "KIC 7272437"
            tag: kic_7272437
            depth_ppm: 100
            depth_tag: d1
          - star: "KIC 7272437"
            tag: kic_7272437
            depth_ppm: 200
            depth_tag: d2
          - star: "KIC 7272437"
            tag: kic_7272437
            depth_ppm: 400
            depth_tag: d3
          - star: "KIC 7272437"
            tag: kic_7272437
            depth_ppm: 800
            depth_tag: d4
          - star: "KIC 7272437"
            tag: kic_7272437
            depth_ppm: 1500
            depth_tag: d5
          - star: "KIC 7272437"
            tag: kic_7272437
            depth_ppm: 3000
            depth_tag: d6
          - star: "KIC 7272437"
            tag: kic_7272437
            depth_ppm: 6000
            depth_tag: d7
          - star: "KIC 7272437"
            tag: kic_7272437
            depth_ppm: 12000
            depth_tag: d8
          # ---- KIC 7347849 ----
          - star: "KIC 7347849"
            tag: kic_7347849
            depth_ppm: 50
            depth_tag: d0
          - star: "KIC 7347849"
            tag: kic_7347849
            depth_ppm: 100
            depth_tag: d1
          - star: "KIC 7347849"
            tag: kic_7347849
            depth_ppm: 200
            depth_tag: d2
          - star: "KIC 7347849"
            tag: kic_7347849
            depth_ppm: 400
            depth_tag: d3
          - star: "KIC 7347849"
            tag: kic_7347849
            depth_ppm: 800
            depth_tag: d4
          - star: "KIC 7347849"
            tag: kic_7347849
            depth_ppm: 1500
            depth_tag: d5
          - star: "KIC 7347849"
            tag: kic_7347849
            depth_ppm: 3000
            depth_tag: d6
          - star: "KIC 7347849"
            tag: kic_7347849
            depth_ppm: 6000
            depth_tag: d7
          - star: "KIC 7347849"
            tag: kic_7347849
            depth_ppm: 12000
            depth_tag: d8
          # ---- KIC 8935630 (replaces KIC 8867895 — only Q0/Q1 in MAST) ----
          - star: "KIC 8935630"
            tag: kic_8935630
            depth_ppm: 50
            depth_tag: d0
          - star: "KIC 8935630"
            tag: kic_8935630
            depth_ppm: 100
            depth_tag: d1
          - star: "KIC 8935630"
            tag: kic_8935630
            depth_ppm: 200
            depth_tag: d2
          - star: "KIC 8935630"
            tag: kic_8935630
            depth_ppm: 400
            depth_tag: d3
          - star: "KIC 8935630"
            tag: kic_8935630
            depth_ppm: 800
            depth_tag: d4
          - star: "KIC 8935630"
            tag: kic_8935630
            depth_ppm: 1500
            depth_tag: d5
          - star: "KIC 8935630"
            tag: kic_8935630
            depth_ppm: 3000
            depth_tag: d6
          - star: "KIC 8935630"
            tag: kic_8935630
            depth_ppm: 6000
            depth_tag: d7
          - star: "KIC 8935630"
            tag: kic_8935630
            depth_ppm: 12000
            depth_tag: d8

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OpenMP runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # -----------------------------------------------------------------------
      # Fetch Q1–Q8 light curve for this star only.
      # KIC 7272437 has a committed Q1–Q8 file; the others need to be fetched
      # at runtime.  --force re-fetches even if a Q3 file is present.
      # -----------------------------------------------------------------------
      - name: Fetch Q1–Q8 light curve for ${{ matrix.star }}
        run: |
          python scripts/fetch_golden.py --target "${{ matrix.star }}" --force

      # -----------------------------------------------------------------------
      # Write a one-row CSV so --quiet-stars-list restricts the run to this star.
      # -----------------------------------------------------------------------
      - name: Write star list CSV
        run: |
          mkdir -p /tmp/star_lists
          printf 'star_id\n%s\n' "${{ matrix.star }}" > /tmp/star_lists/${{ matrix.tag }}.csv

      # -----------------------------------------------------------------------
      # Restore checkpoint if a prior run uploaded one (enables resume).
      # Continue-on-error: if no checkpoint artifact exists yet this is fine.
      # -----------------------------------------------------------------------
      - name: Restore checkpoint (if any)
        id: restore-checkpoint
        uses: actions/download-artifact@v4
        with:
          name: ir-checkpoint-${{ matrix.tag }}-${{ matrix.depth_tag }}
          path: /tmp/checkpoints
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Run injection-recovery for this (star, depth) cell.
      # Output-name encodes both the star tag and the depth so each shard gets
      # a unique filename.
      # -----------------------------------------------------------------------
      - name: Run injection_recovery.py — ${{ matrix.star }} / ${{ matrix.depth_ppm }} ppm
        run: |
          mkdir -p data/artifacts/shards /tmp/checkpoints
          python scripts/injection_recovery.py \
            --seed 42 \
            --n-per-cell 5 \
            --depth-filter ${{ matrix.depth_ppm }} \
            --output-dir data/artifacts/shards \
            --output-name "injection_recovery_${{ matrix.tag }}_${{ matrix.depth_tag }}" \
            --data-dir data/golden \
            --quiet-stars-list /tmp/star_lists/${{ matrix.tag }}.csv \
            --checkpoint-dir /tmp/checkpoints \
            --no-plot

      # -----------------------------------------------------------------------
      # Guard: shard must record TLS, not BLS_fallback.
      # -----------------------------------------------------------------------
      - name: Verify shard used TLS
        run: |
          python - <<'EOF'
          import json, sys, pathlib

          path = pathlib.Path(
              "data/artifacts/shards/"
              "injection_recovery_${{ matrix.tag }}_${{ matrix.depth_tag }}.json"
          )
          data = json.loads(path.read_text())
          alg  = data.get("detection_algorithm", "<missing>")
          if alg != "TLS":
              print(f"FAIL: {path.name}: detection_algorithm={alg!r} (expected 'TLS')", file=sys.stderr)
              sys.exit(1)
          n   = data.get("n_injections_attempted", 0)
          rec = sum(1 for r in data.get("results", []) if r.get("recovered"))
          pct = 100 * rec / n if n else 0.0
          print(f"Verified TLS: {n} injections, {rec} recovered ({pct:.1f}%)")
          EOF

      - name: Upload shard
        uses: actions/upload-artifact@v4
        with:
          name: ir-shard-${{ matrix.tag }}-${{ matrix.depth_tag }}
          path: |
            data/artifacts/shards/injection_recovery_${{ matrix.tag }}_${{ matrix.depth_tag }}.json
            data/artifacts/shards/injection_recovery_${{ matrix.tag }}_${{ matrix.depth_tag }}.manifest.json
          if-no-files-found: error
          retention-days: 30

      # Upload checkpoint so a re-triggered job can resume.
      - name: Upload checkpoint
        if: always()   # upload even on failure so partial progress is preserved
        uses: actions/upload-artifact@v4
        with:
          name: ir-checkpoint-${{ matrix.tag }}-${{ matrix.depth_tag }}
          path: /tmp/checkpoints/injection_recovery_${{ matrix.tag }}_${{ matrix.depth_tag }}.checkpoint.jsonl
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Merge shards → single injection_recovery.json artifact.
  # ---------------------------------------------------------------------------
  merge-shards:
    name: Merge IR shards
    runs-on: ubuntu-latest
    needs: injection-recovery-shard

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # -----------------------------------------------------------------------
      # Download all shard artifacts into data/artifacts/shards/
      # -----------------------------------------------------------------------
      - name: Download IR shards
        uses: actions/download-artifact@v4
        with:
          pattern: ir-shard-*
          path: data/artifacts/shards
          merge-multiple: true

      - name: List downloaded shards
        run: ls -lh data/artifacts/shards/

      # -----------------------------------------------------------------------
      # Merge and run asymptote checks.  Fails the job if either check fails.
      # -----------------------------------------------------------------------
      - name: Merge shards and run asymptote checks
        run: |
          python scripts/merge_injection_recovery.py \
            --shard-dir data/artifacts/shards \
            --output-dir data/artifacts \
            --no-plot

      # -----------------------------------------------------------------------
      # Final guard: merged artifact must record TLS.
      # -----------------------------------------------------------------------
      - name: Verify merged artifact used TLS
        run: |
          python - <<'EOF'
          import json, sys, pathlib

          path = pathlib.Path("data/artifacts/injection_recovery.json")
          data = json.loads(path.read_text())
          alg  = data.get("detection_algorithm", "<missing>")
          if alg != "TLS":
              print(f"FAIL: {path.name}: detection_algorithm={alg!r} (expected 'TLS')", file=sys.stderr)
              sys.exit(1)
          n   = data.get("n_injections_attempted", 0)
          rec = sum(1 for r in data.get("results", []) if r.get("recovered"))
          print(f"Verified TLS: {n} injections, {rec} recovered ({100*rec/n:.1f}%)")

          ah = data.get("asymptote_high_depth", {})
          al = data.get("asymptote_low_depth", {})
          print(f"Low-depth asymptote:  mean_rate={al.get('mean_rate')}  pass={al.get('pass_low_asymptote')}")
          print(f"High-depth asymptote: mean_rate={ah.get('mean_rate')}  pass={ah.get('pass_high_asymptote')}")
          EOF

      # -----------------------------------------------------------------------
      # Upload final merged artifact plus all shards for download and commit.
      # -----------------------------------------------------------------------
      - name: Upload merged artifact
        uses: actions/upload-artifact@v4
        with:
          name: tls-artifacts
          path: |
            data/artifacts/injection_recovery.json
            data/artifacts/injection_recovery.manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload all shards (for audit)
        uses: actions/upload-artifact@v4
        with:
          name: tls-shards
          path: data/artifacts/shards/
          if-no-files-found: error
          retention-days: 30
