name: Generate TLS Artifacts

# Triggered manually only.  Never runs automatically.
# After downloading the uploaded artifacts, commit them and push.
on:
  workflow_dispatch:

jobs:
  generate-artifacts:
    name: Generate TLS artifacts (Ubuntu)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # -----------------------------------------------------------------------
      # Python
      # -----------------------------------------------------------------------
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # -----------------------------------------------------------------------
      # System deps — libgomp is usually pre-installed on ubuntu-latest;
      # be explicit so a future runner change does not silently break XGBoost.
      # -----------------------------------------------------------------------
      - name: Install OpenMP runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev

      # -----------------------------------------------------------------------
      # Python deps — full dev set so TLS and batman are available.
      # -----------------------------------------------------------------------
      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      # -----------------------------------------------------------------------
      # Verify that transitleastsquares is importable.
      # -----------------------------------------------------------------------
      - name: Verify TLS imports
        run: |
          python - <<'EOF'
          import transitleastsquares
          from importlib.metadata import version, PackageNotFoundError

          # Guard: the callable that the pipeline actually uses must be present.
          tls_cls = transitleastsquares.transitleastsquares
          assert callable(tls_cls), "transitleastsquares.transitleastsquares is not callable"

          # Version is informational only — never fail the job on a missing string.
          try:
              ver = version("transitleastsquares")
          except PackageNotFoundError:
              ver = "unknown"

          print(f"transitleastsquares {ver} OK (transitleastsquares.transitleastsquares callable)")
          EOF

      # -----------------------------------------------------------------------
      # Verify batman loads in a fresh spawn worker process.
      # Uses a real file (scripts/_verify_spawn_worker.py) rather than a
      # heredoc because multiprocessing's "spawn" start method re-imports
      # __main__ in the child interpreter — if __main__ came from stdin the
      # child raises FileNotFoundError: '<stdin>'.
      # "spawn" is forced explicitly: Ubuntu's default is "fork", which would
      # never exercise the macOS code path this guard exists to protect.
      # -----------------------------------------------------------------------
      - name: Verify batman loads in a spawn worker process
        run: python scripts/_verify_spawn_worker.py

      # -----------------------------------------------------------------------
      # Adversarial self-test
      # -----------------------------------------------------------------------
      - name: Run adversarial_selftest.py
        run: |
          python scripts/adversarial_selftest.py \
            --seed 42 \
            --n-trials 20 \
            --output-dir data/artifacts \
            --data-dir data/golden \
            --no-plot

      # -----------------------------------------------------------------------
      # Injection-recovery completeness
      # -----------------------------------------------------------------------
      - name: Run injection_recovery.py
        run: |
          python scripts/injection_recovery.py \
            --seed 42 \
            --n-per-cell 5 \
            --output-dir data/artifacts \
            --data-dir data/golden \
            --no-plot

      # -----------------------------------------------------------------------
      # Guard: fail the job if either artifact records BLS_fallback.
      # A BLS-fallback artifact must never replace a TLS artifact.
      # -----------------------------------------------------------------------
      - name: Verify both artifacts used TLS (not BLS_fallback)
        run: |
          python - <<'EOF'
          import json, sys, pathlib

          failures = []
          for name in ("adversarial_selftest", "injection_recovery"):
              path = pathlib.Path("data/artifacts") / f"{name}.json"
              data = json.loads(path.read_text())
              alg  = data.get("detection_algorithm", "<missing>")
              if alg != "TLS":
                  failures.append(f"{path.name}: detection_algorithm={alg!r} (expected 'TLS')")

          if failures:
              for msg in failures:
                  print("FAIL:", msg, file=sys.stderr)
              sys.exit(1)

          print("Both artifacts verified: detection_algorithm=TLS")
          EOF

      # -----------------------------------------------------------------------
      # Upload artifacts for download and manual commit.
      # -----------------------------------------------------------------------
      - name: Upload JSON artifacts and manifests
        uses: actions/upload-artifact@v4
        with:
          name: tls-artifacts
          path: |
            data/artifacts/adversarial_selftest.json
            data/artifacts/adversarial_selftest.manifest.json
            data/artifacts/injection_recovery.json
            data/artifacts/injection_recovery.manifest.json
          if-no-files-found: error
          retention-days: 30
