name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ---------------------------------------------------------------------------
  # Fast contract + policy tests — no network, no FITS files, no astropy.
  #
  # Install order is deliberate:
  #   1. pip install -e . --no-deps   installs falsifier into the venv using
  #      only its declared core deps (pydantic, numpy).  --no-deps means pip
  #      will NOT follow any transitive requirements — this proves the contracts
  #      import correctly with pydantic alone and surfaces any accidental
  #      module-scope astropy/lightkurve/etc. import immediately.
  #   2. pip install pydantic pytest   satisfies the two deps that --no-deps
  #      withheld.
  #
  # The boundary is enforced by two layers:
  #   1. --ignore for files that import astropy/heavydeps at MODULE scope —
  #      pytest cannot even collect those files without the dep installed.
  #   2. -m "not requires_astropy" for files where astropy is imported only
  #      INSIDE test method bodies — pytest can collect those files with numpy
  #      alone and the marker deselects the heavy tests.  This covers the three
  #      script-unit test files (test_adversarial_selftest.py etc.) whose pure
  #      array-manipulation classes stay in the fast job.
  #
  # Do NOT add a PYTHONPATH env var or conftest.py sys.path hack to this job.
  # ---------------------------------------------------------------------------
  test-fast:
    name: Fast tests (stdlib + pydantic only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package (no transitive deps)
        run: |
          pip install --upgrade pip
          pip install -e . --no-deps
          pip install pydantic numpy pytest pytest-timeout

      - name: Run fast test suite
        run: |
          pytest tests/ \
            --ignore=tests/test_kepler10_recovery.py \
            --ignore=tests/test_known_eb_rejected.py \
            --ignore=tests/pipeline/stages/test_ingest.py \
            --ignore=tests/test_time_systems.py \
            --ignore=tests/test_api_deletion.py \
            --ignore=tests/test_chat_layer.py \
            --ignore=tests/test_mast_serialisation.py \
            -m "not requires_astropy" \
            -q

  # ---------------------------------------------------------------------------
  # No-invented-numbers policy gate — stdlib only, no falsifier import needed.
  # ---------------------------------------------------------------------------
  test-no-invented-numbers:
    name: No invented numbers (policy gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pytest
        run: |
          pip install --upgrade pip
          pip install -e . --no-deps
          pip install pydantic numpy pytest

      - name: Run no-invented-numbers gate
        run: pytest tests/test_no_number_is_invented.py -v
        # frontend/dist/ is absent here (not built yet); the source-file scan
        # still runs.  The frontend-build job below builds first, then runs
        # test_build_output_floats_are_backed_by_artifacts against the real
        # bundle.  The gate never silently passes due to a missing dist/.

  # ---------------------------------------------------------------------------
  # Frontend build + bundle artifact check.
  # ---------------------------------------------------------------------------
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # vite 6.x requires node ^20.19.0 || >=22.12.0; pin to 20.19 to match
          # that lower bound and keep the npm major (10.x) stable across runs.
          node-version: "20.19"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        # manualChunks in vite.config.js splits vendor (node_modules) into
        # vendor-*.js; the bundle-scan test skips that chunk and only checks
        # application code in index-*.js.
        run: npm run build
        working-directory: frontend

      - name: Set up Python (for bundle artifact check)
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pytest
        run: |
          pip install --upgrade pip
          pip install -e . --no-deps
          pip install pydantic numpy pytest

      - name: Run no-invented-numbers gate against built bundle
        run: |
          pytest tests/test_no_number_is_invented.py::test_build_output_floats_are_backed_by_artifacts -v
        # frontend/dist/ now exists so the build-output test is not skipped.

  # ---------------------------------------------------------------------------
  # README claim verification — AGENTS.md Rule 5.
  # verify_readme.py uses only stdlib + re; no package install needed.
  # ---------------------------------------------------------------------------
  verify-readme:
    name: Verify README claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          pip install --upgrade pip
          pip install -e . --no-deps
          pip install pydantic numpy pytest

      - name: Verify README claims
        run: python scripts/verify_readme.py --strict
        # Exits 1 on any drift between README and committed sources.
        # Exits 2 on a CLAIM block with no registry entry, or vice versa.
        # Enforces AGENTS.md Rule 5: no claim in README unless regenerable.

      - name: Check README badge owner/repo
        run: python scripts/check_badge_owner.py
        # Fails if any github.com URL in README.md names an owner/repo other
        # than the actual repository (detected from git remote origin).
        # Guards against stale fork URLs in badges and links.

      - name: Assert gate-table rows match CLAIM:n_proven_gates
        run: pytest tests/test_readme_tables_match_claims.py -v
        # Bidirectional gate: fails if a gate row is deleted from the README table
        # AND fails if CLAIM:n_proven_gates is hand-edited to a wrong number.
        # Closes the structural hole where verify_readme.py only checks CLAIM blocks,
        # not prose tables (defect 10 in docs/WHAT_THE_GATES_CAUGHT.md).

  # ---------------------------------------------------------------------------
  # Full suite with astropy and the complete dev dependency set.
  #
  # pip install -e ".[dev]"  installs falsifier plus every optional dep
  # declared in [project.optional-dependencies.dev] in pyproject.toml.
  #
  # libomp note
  # -----------
  # XGBoost's Linux wheel links against libgomp (GNU OpenMP), which ships as
  # part of libgomp1 / libomp-dev on Ubuntu and is present in the default
  # GitHub Actions ubuntu-latest image.  No extra apt step is needed on Ubuntu.
  #
  # On macOS, XGBoost's wheel uses @rpath/libomp.dylib with rpath pointing at
  # /opt/homebrew/opt/libomp/lib.  This requires Homebrew's libomp keg.
  # CI runs on ubuntu-latest only; macOS developers must run:
  #   brew install libomp
  # See the "Install prerequisites" section of README.md for details.
  # ---------------------------------------------------------------------------
  test-full:
    name: Full tests (astropy + xgboost required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install OpenMP runtime (required by XGBoost on Ubuntu)
        # libgomp1 is usually pre-installed on ubuntu-latest; this step is
        # explicit so the dependency is documented and any future runner change
        # does not silently break XGBoost imports.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libomp-dev

      - name: Install package with full dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest-asyncio

      - name: Verify XGBoost imports (catches libomp breakage before tests run)
        run: python -c "import xgboost; print('xgboost', xgboost.__version__, 'OK')"

      - name: Run full test suite
        run: |
          pytest tests/ \
            --ignore=tests/test_api_deletion.py \
            --ignore=tests/test_chat_layer.py \
            -q
        # test_api_deletion.py and test_chat_layer.py require httpx and
        # pytest-asyncio extras not installed here; all other tests including
        # the golden regression tests (requires_astropy marker) run in this job.

  # ---------------------------------------------------------------------------
  # Production smoke check — curls the live frontend and backend health.
  #
  # Fails on any non-200 response so a broken judge link surfaces in CI
  # instead of during judging.
  #
  # FRONTEND_URL:  https://falsifier.vercel.app
  # BACKEND_URL:   set in repository secret BACKEND_HEALTH_URL, or falls back
  #                to the placeholder below which will fail (intentional — the
  #                job is skipped when the secret is absent to avoid false
  #                negatives on forks).
  #
  # Vercel Deployment Protection note:
  #   If Vercel Authentication is enabled, the frontend check will return 403.
  #   See docs/RELEASE_CHECKLIST.md for instructions to disable it before
  #   submission.
  # ---------------------------------------------------------------------------
  smoke-check:
    name: Production smoke check
    runs-on: ubuntu-latest
    # Only run on the main branch or when explicitly triggered, not on every PR
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Check production frontend (falsifier.vercel.app)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --user-agent "Falsifier-CI-smoke-check/1.0" \
            "https://falsifier.vercel.app")
          echo "Frontend HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Production frontend returned HTTP $STATUS (expected 200)."
            echo "If Vercel Deployment Protection is enabled, disable it before submission."
            echo "See docs/RELEASE_CHECKLIST.md for instructions."
            exit 1
          fi

      - name: Check backend health endpoint
        # Requires BACKEND_HEALTH_URL secret.  Skipped gracefully when absent.
        run: |
          BACKEND_URL="${{ secrets.BACKEND_HEALTH_URL }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_HEALTH_URL secret not set — skipping backend check."
            echo "Set the secret to the backend health URL (e.g. https://<app>.us-south.codeengine.appdomain.cloud/health)"
            exit 0
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            "$BACKEND_URL")
          echo "Backend health HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Backend health check returned HTTP $STATUS (expected 200)."
            exit 1
          fi
