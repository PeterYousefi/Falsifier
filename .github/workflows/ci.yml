name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # -------------------------------------------------------------------------
  # Fast contract + policy tests — no network, no FITS files, no astropy
  # -------------------------------------------------------------------------
  test-fast:
    name: Fast tests (stdlib + pydantic only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pydantic numpy pytest

      - name: Run fast test suite
        run: |
          pytest tests/ \
            --ignore=tests/test_kepler10_recovery.py \
            --ignore=tests/test_known_eb_rejected.py \
            --ignore=tests/pipeline/stages/test_ingest.py \
            --ignore=tests/test_time_systems.py \
            -q

  # -------------------------------------------------------------------------
  # README claim verification — AGENTS.md Rule 5
  # -------------------------------------------------------------------------
  verify-readme:
    name: Verify README claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify README claims
        run: |
          python scripts/verify_readme.py --strict
        # Exit 1 on any drift between README and committed sources.
        # Exit 2 on a block in README with no registry entry, or vice versa.
        # This enforces AGENTS.md Rule 5:
        #   "No claim appears in the README that is not regenerated by the
        #    reproducibility script."

  # -------------------------------------------------------------------------
  # Full suite with astropy — requires astropy install
  # -------------------------------------------------------------------------
  test-full:
    name: Full tests (astropy required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install full dependencies
        run: |
          pip install --upgrade pip
          pip install pydantic numpy pytest astropy lightkurve

      - name: Run full test suite (excluding golden integration tests)
        run: |
          pytest tests/ \
            --ignore=tests/test_kepler10_recovery.py \
            --ignore=tests/test_known_eb_rejected.py \
            -q
        # Golden integration tests (kepler10_recovery, known_eb_rejected)
        # require committed FITS files fetched by scripts/fetch_golden.py.
        # They are excluded from CI until golden files are committed to the repo.
